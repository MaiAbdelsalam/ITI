<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.0/css/all.min.css" integrity="sha512-10/jx2EXwxxWqCLX/hHth/vu2KY3jCF70dCQB8TSgNjbCVAC/8vai53GfMDrO2Emgwccf2pJqxct9ehpzG+MTw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="css/admin.css">
    <link rel="stylesheet" href="css/login_reg.css">
</head>
<body>
    <div class="parent">

        <div class="sidebar">
            <div class="sidebar-brand">
                <h1 class="logo"><img src="assets/awareness-campaign.png">Campria</h1>
            </div>
            <div class="sidebar-menu">
                <ul>
                    <li>
                        <a href="admin.html"  class="active">
                            <span><i class="fas fa-home"></i></span>
                            <span>Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a href="users.html">
                            <span><i class="fas fa-users"></i></span>
                            <span>Users</span>  
                        </a>
                    </li>
                    <li>
                        <a href="campaigns.html">
                            <span><i class="fas fa-bullhorn"></i></span>
                            <span>Campaigns</span> 
                        </a>
                    </li>
                    <li>
                        <a href="pledges.html">
                            <span><i class="fas fa-donate"></i></span>
                            <span>Pledges</span>     
                        </a>
                    </li>
                    <li>
                        <a href="" id="signOut" >
                            <span><i class="fas fa-sign-out"></i></span>
                            <span>signOut</span>     
                        </a>
                    </li>
                </ul>
    
            </div>
        </div>
    
        <div class="main-content">
            <header>
                <h2 class="header-title">
                    <span id="nav-toggle">
                        <i class="fas fa-bars"></i>
                    </span>
                    <span>   Dashboard
                    </span>
                </h2>
                <!-- <div class="search-wrapper">
                    <span class="fas fa-search"></span>
                    <input type="search" placeholder="Search Here">
                </div> -->
    
                <div class="user-wrapper">
                    <img src="assets/awareness-campaign.png" width="40px" height="40px" alt="">
                    <div>
                        <h4>John Doe</h4>
                        <small>Super Admin</small>
                    </div>
                </div>
            </header>
            <main>
                <div class="dashboard-cart">
                    
                </div>
                        <section class="signin sec-form">
                            <div class="form-container">
                                <p class="title">Profile Data</p>
                                <form action="" class="form">
                                    <div class="image-container">
                                        <div class="form-image">
                                            <input type="file" hidden >
                                            <img src="assets/user.png"  alt="">
                                        </div>
                                        <p>choose profile Image</p>
                                    </div>
                                    <input type="text" placeholder="Enter Your Name" class="name">
                                    <input type="email" placeholder="Enter Your Email" class="email">
                                    <input type="password" placeholder="Enter Your Password" class="password">
                                    <p class="alert-label" style="color:red"></p>
                                    <button class="form-btn" id="signup">Edit Profile</button>   
                                </form>
                    
                            </div>
                        </section>
                    
            </main>
        </div>
        
    </div>
    <section class="signin sec-form">
        <div class="form-container">
            <p class="title">Profile Data</p>
            <form action="" class="form">
                <div class="image-container">
                    <div class="form-image">
                        <input type="file" hidden >
                        <img src="assets/user.png"  alt="">
                    </div>
                    <p>choose profile Image</p>
                </div>
                <input type="text" placeholder="Enter Your Name" class="name">
                <input type="email" placeholder="Enter Your Email" class="email">
                <input type="password" placeholder="Enter Your Password" class="password">
                <p class="alert-label" style="color:red"></p>
                <button class="form-btn" id="signup">Edit Profile</button>   
            </form>

        </div>
    </section>
